<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; text-align: center; background: #f2f2f2; }
    .card { margin: 20px auto; padding: 20px; width: 300px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    canvas { max-width: 700px; margin: 20px auto; background: white; border-radius: 8px; }
    select { font-size: 16px; }
  </style>
</head>
<body>
  <h2>LoRa Sensor Dashboard</h2>
  <label for="nodeSelect">Select Node: </label>
  <select id="nodeSelect">
    <option>Node1</option>
    <option>Node2</option>
    <option>Node3</option>
    <option>Node4</option>
    <option>Node5</option>
  </select>

  <div class="card">
    <p><strong>Soil:</strong> <span id="soil">Loading...</span></p>
    <p><strong>Air:</strong> <span id="air">Loading...</span></p>
    <p><strong>Last Updated:</strong> <span id="timestamp">--</span></p>
    <p><strong>Alert:</strong> <span id="alert">--</span></p>
  </div>

  <canvas id="myChart"></canvas>

  <script>
    const chart = new Chart(document.getElementById('myChart'), {
      type: 'line',
      data: { labels: [], datasets: [
        { label: 'Soil', borderColor: 'green', backgroundColor: 'green', data: [], fill: false },
        { label: 'Air', borderColor: 'blue', backgroundColor: 'blue', data: [], fill: false },
      ] },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    const sasToken = "sp=r&st=2025-04-30T04:02:20Z&se=2026-01-01T13:02:20Z&spr=https&sv=2024-11-04&sr=c&sig=oD6buZNfxH2Q6JvuI%2FmAHIpBhA%2B2cuisdPaNp1NiLEk%3D";
    const containerUrl = "https://wsn.blob.core.windows.net/loradata";

    async function fetchLatestJson(node) {
      const now = new Date();
      const path = `${containerUrl}/node-${node}/${now.getUTCFullYear()}/${String(now.getUTCMonth()+1).padStart(2, '0')}/${String(now.getUTCDate()).padStart(2, '0')}/${String(now.getUTCHours()).padStart(2, '0')}`;
      const listUrl = `${path}?restype=container&comp=list&recursive=true&${sasToken}`;

      try {
        const response = await fetch(listUrl);
        const xml = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xml, "text/xml");
        const blobs = Array.from(xmlDoc.getElementsByTagName("Name"))
          .map(tag => tag.textContent)
          .filter(name => name.endsWith(".json"));

        if (blobs.length === 0) throw new Error("No files");

        const latest = blobs.sort().reverse()[0];
        const jsonUrl = `${containerUrl}/${latest}?${sasToken}`;
        const jsonData = await fetch(jsonUrl).then(r => r.json());

        document.getElementById("soil").innerText = jsonData.soil;
        document.getElementById("air").innerText = jsonData.air;
        document.getElementById("timestamp").innerText = new Date().toLocaleString();
        document.getElementById("alert").innerText = (jsonData.soil > 700 || jsonData.air > 700) ? "⚠️ High reading" : "Normal";

        chart.data.labels.push(new Date().toLocaleTimeString());
        chart.data.datasets[0].data.push(jsonData.soil);
        chart.data.datasets[1].data.push(jsonData.air);
        if (chart.data.labels.length > 10) {
          chart.data.labels.shift();
          chart.data.datasets.forEach(ds => ds.data.shift());
        }
        chart.update();

      } catch (err) {
        document.getElementById("soil").innerText = "Error";
        document.getElementById("air").innerText = "Error";
        document.getElementById("timestamp").innerText = "--";
        document.getElementById("alert").innerText = "Fetch failed";
        console.error(err);
      }
    }

    document.getElementById("nodeSelect").addEventListener("change", () => {
      chart.data.labels = [];
      chart.data.datasets.forEach(ds => ds.data = []);
      chart.update();
    });

    setInterval(() => {
      const node = document.getElementById("nodeSelect").value;
      fetchLatestJson(node);
    }, 15000); // every 15 sec

    fetchLatestJson("Node1"); // initial load
  </script>
</body>
</html>
