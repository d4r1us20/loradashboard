<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; text-align: center; background: #f2f2f2; }
    .card { margin: 20px auto; padding: 20px; width: 300px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    canvas { max-width: 700px; margin: 20px auto; background: white; border-radius: 8px; }
    select { font-size: 16px; }
  </style>
</head>
<body>
  <h2>LoRa Sensor Dashboard</h2>
  <label for="nodeSelect">Select Node: </label>
  <select id="nodeSelect">
    <option>Node1</option>
    <option>Node2</option>
    <option>Node3</option>
    <option>Node4</option>
    <option>Node5</option>
  </select>

  <div class="card">
    <p><strong>Soil:</strong> <span id="soil">Loading...</span></p>
    <p><strong>Air:</strong> <span id="air">Loading...</span></p>
    <p><strong>Last Updated:</strong> <span id="timestamp">--</span></p>
    <p><strong>Alert:</strong> <span id="alert">--</span></p>
  </div>

  <canvas id="myChart"></canvas>

  <script>
    const mockRanges = {
      Node1: { soil: [350, 450], air: [190, 250] },
      Node2: { soil: [370, 460], air: [180, 230] },
      Node3: { soil: [360, 440], air: [200, 260] },
      Node4: { soil: [390, 470], air: [170, 220] },
      Node5: { soil: [400, 480], air: [160, 210] }
    };

    const chart = new Chart(document.getElementById('myChart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Soil', borderColor: 'green', backgroundColor: 'green', data: [], fill: false },
          { label: 'Air', borderColor: 'blue', backgroundColor: 'blue', data: [], fill: false }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function fetchMockData(node) {
      const range = mockRanges[node];
      const soil = getRandomInt(...range.soil);
      const air = getRandomInt(...range.air);

      document.getElementById("soil").innerText = soil;
      document.getElementById("air").innerText = air;
      document.getElementById("timestamp").innerText = new Date().toLocaleString();
      document.getElementById("alert").innerText = (soil > 700 || air > 700) ? "⚠️ High reading" : "Normal";

      chart.data.labels.push(new Date().toLocaleTimeString());
      chart.data.datasets[0].data.push(soil);
      chart.data.datasets[1].data.push(air);

      if (chart.data.labels.length > 10) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }
      chart.update();
    }

    document.getElementById("nodeSelect").addEventListener("change", () => {
      chart.data.labels = [];
      chart.data.datasets.forEach(ds => ds.data = []);
      chart.update();
      fetchMockData(document.getElementById("nodeSelect").value);
    });

    setInterval(() => {
      const node = document.getElementById("nodeSelect").value;
      fetchMockData(node);
    }, 15000);

    fetchMockData("Node1");
  </script>
</body>
</html>
