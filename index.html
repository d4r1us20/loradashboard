<!DOCTYPE html>
<html>
<head>
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: auto;
      width: 80%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    canvas {
      max-width: 100%;
    }
    select {
      margin: 10px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>LoRa Sensor Dashboard</h1>

  <div>
    <label for="nodeSelect">Select Node:</label>
    <select id="nodeSelect">
      <option value="Node1">Node 1</option>
      <option value="Node2">Node 2</option>
      <option value="Node3">Node 3</option>
      <option value="Node4">Node 4</option>
      <option value="Node5">Node 5</option>
    </select>
  </div>

  <div class="card">
    <p><strong>Soil:</strong> <span id="soil">--</span></p>
    <p><strong>Air:</strong> <span id="air">--</span></p>
    <p><strong>Last Updated:</strong> <span id="timestamp">--</span></p>
    <p><strong>Alert:</strong> <span id="alert">None</span></p>
  </div>

  <canvas id="sensorChart" height="100"></canvas>

  <script>
    const sasToken = "<YOUR_SAS_TOKEN>";
    const baseUrl = "https://wsn.blob.core.windows.net/loradata";

    const chartCtx = document.getElementById('sensorChart').getContext('2d');
    const soilData = [];
    const airData = [];
    const labels = [];

    const chart = new Chart(chartCtx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Soil',
            data: soilData,
            borderColor: 'green',
            fill: false
          },
          {
            label: 'Air',
            data: airData,
            borderColor: 'blue',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    async function fetchLatestData(node) {
      const now = new Date();
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const hh = String(now.getUTCHours()).padStart(2, '0');
      const path = `node-${node}/${yyyy}/${mm}/${dd}/${hh}/`;
      const listUrl = `${baseUrl}?restype=container&comp=list&prefix=${path}&${sasToken}`;

      try {
        const listRes = await fetch(listUrl);
        const xmlText = await listRes.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const blobNames = Array.from(xml.getElementsByTagName("Name")).map(e => e.textContent);

        if (blobNames.length === 0) {
          throw new Error("No blob found");
        }

        const latestBlob = blobNames[blobNames.length - 1];
        const blobUrl = `${baseUrl}/${latestBlob}?${sasToken}`;
        const res = await fetch(blobUrl);
        const text = await res.text();
        const lines = text.trim().split('\n');
        const lastLine = JSON.parse(lines[lines.length - 1]);

        const payload = JSON.parse(atob(lastLine.Body));
        const { soil, air, deviceId } = payload;

        const timestamp = new Date().toLocaleString();
        document.getElementById("soil").textContent = soil;
        document.getElementById("air").textContent = air;
        document.getElementById("timestamp").textContent = timestamp;

        let alertText = "None";
        if (soil > 600 || air > 600) alertText = "High readings!";
        else if (soil < 300 || air < 300) alertText = "Low readings!";
        document.getElementById("alert").textContent = alertText;

        // Update chart
        if (labels.length >= 20) {
          labels.shift();
          soilData.shift();
          airData.shift();
        }
        labels.push(timestamp);
        soilData.push(soil);
        airData.push(air);
        chart.update();

      } catch (err) {
        console.error("Error loading data:", err);
        document.getElementById("soil").textContent = "Error";
        document.getElementById("air").textContent = "Error";
        document.getElementById("timestamp").textContent = "--";
        document.getElementById("alert").textContent = "Connection error";
      }
    }

    function updateDashboard() {
      const selectedNode = document.getElementById("nodeSelect").value;
      fetchLatestData(selectedNode);
    }

    document.getElementById("nodeSelect").addEventListener("change", updateDashboard);
    updateDashboard();
    setInterval(updateDashboard, 15000);
  </script>
</body>
</html>
