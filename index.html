<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoRa Sensor Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>LoRa Sensor Dashboard</h2>
    <p id="soil">Soil: Loading...</p>
    <p id="air">Air: Loading...</p>
    <p id="time">Last Updated: --</p>
  </div>

  <script>
    const containerUrl = "https://wsn.blob.core.windows.net/loradata";
    const sasToken = "?sp=r&st=2025-04-30T01:13:29Z&se=2026-01-15T10:13:29Z&spr=https&sv=2024-11-04&sr=c&sig=LbwoHOeoVgRTcZgnE4pBhyC3bPTYqRoQpgzZEFsqLdk%3D";

    async function loadLatestSensorData() {
      try {
        // 1. List all blobs in the container
        const listUrl = `${containerUrl}?restype=container&comp=list${sasToken}`;
        const response = await fetch(listUrl);
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "application/xml");
        const blobs = Array.from(xmlDoc.getElementsByTagName("Name"));

        // 2. Find the latest JSON file
        const jsonFiles = blobs
          .map(el => el.textContent)
          .filter(name => name.endsWith(".json"))
          .sort()
          .reverse();

        if (jsonFiles.length === 0) {
          throw new Error("No JSON files found");
        }

        const latestFile = jsonFiles[0];
        const dataUrl = `${containerUrl}/${latestFile}${sasToken}`;

        // 3. Fetch the latest JSON data
        const dataRes = await fetch(dataUrl);
        const data = await dataRes.json();

        document.getElementById("soil").innerText = `Soil: ${data.soil ?? "N/A"}`;
        document.getElementById("air").innerText = `Air: ${data.air ?? "N/A"}`;
        document.getElementById("time").innerText = `Last Updated: ${data.timestamp ?? "--"}`;

      } catch (err) {
        console.error("Error loading data:", err);
        document.getElementById("soil").innerText = "Soil: Error";
        document.getElementById("air").innerText = "Air: Error";
        document.getElementById("time").innerText = "Last Updated: Error";
      }
    }

    loadLatestSensorData();
  </script>
</body>
</html>
