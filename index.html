<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      width: 600px;
    }
    select {
      font-size: 16px;
      padding: 8px;
    }
    canvas {
      margin-top: 30px;
    }
    #alertBox {
      margin-top: 20px;
      padding: 15px;
      background-color: #ffd1d1;
      color: #a80000;
      border: 1px solid #a80000;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>LoRa Sensor Dashboard</h2>

  <label for="nodeSelect">Select Node:</label>
  <select id="nodeSelect">
    <option value="node01">Node 01</option>
    <option value="node02">Node 02</option>
    <option value="node03">Node 03</option>
    <option value="node04">Node 04</option>
    <option value="node05">Node 05</option>
  </select>

  <div class="card">
    <p id="soil">Soil: --</p>
    <p id="air">Air: --</p>
    <p id="time">Last Updated: --</p>
    <canvas id="sensorChart" width="560" height="280"></canvas>
    <div id="alertBox"></div>
  </div>

  <script>
    const containerUrl = "https://wsn.blob.core.windows.net/loradata";
    const sasToken = "?sp=r&st=2025-04-30T01:13:29Z&se=2026-01-15T10:13:29Z&spr=https&sv=2024-11-04&sr=c&sig=LbwoHOeoVgRTcZgnE4pBhyC3bPTYqRoQpgzZEFsqLdk%3D";

    let chart;

    async function loadSensorData(nodeId) {
      try {
        const prefix = `node-${nodeId}/`;
        const listUrl = `${containerUrl}?restype=container&comp=list&prefix=${prefix}&${sasToken.substring(1)}`;
        const response = await fetch(listUrl);
        const xml = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xml, "application/xml");
        const blobs = Array.from(xmlDoc.getElementsByTagName("Name"))
          .map(el => el.textContent)
          .filter(name => name.endsWith(".json"))
          .sort()
          .reverse()
          .slice(0, 10); // Get last 10 readings

        const dataPoints = [];

        for (const blob of blobs.reverse()) {
          const fileUrl = `${containerUrl}/${blob}?${sasToken.substring(1)}`;
          const fileRes = await fetch(fileUrl);
          const data = await fileRes.json();
          dataPoints.push({
            soil: data.soil ?? null,
            air: data.air ?? null,
            timestamp: new Date(data.timestamp ?? Date.now()).toLocaleTimeString()
          });
        }

        const latest = dataPoints[dataPoints.length - 1];

        document.getElementById("soil").innerText = `Soil: ${latest.soil ?? "--"}`;
        document.getElementById("air").innerText = `Air: ${latest.air ?? "--"}`;
        document.getElementById("time").innerText = `Last Updated: ${latest.timestamp ?? "--"}`;

        updateChart(dataPoints);
        checkAlerts(latest);

      } catch (err) {
        console.error("Failed to load sensor data:", err);
        document.getElementById("soil").innerText = "Soil: Error";
        document.getElementById("air").innerText = "Air: Error";
        document.getElementById("time").innerText = "Last Updated: Error";
        document.getElementById("alertBox").style.display = "none";
      }
    }

    function checkAlerts(data) {
      const alertBox = document.getElementById("alertBox");
      let alerts = [];

      if (data.soil !== null && data.soil < 200) {
        alerts.push("⚠️ Soil too dry (below 200)");
      }

      if (data.air !== null && data.air > 1000) {
        alerts.push("⚠️ Poor air quality (above 1000)");
      }

      if (alerts.length > 0) {
        alertBox.innerHTML = alerts.join("<br>");
        alertBox.style.display = "block";
      } else {
        alertBox.style.display = "none";
      }
    }

    function updateChart(dataPoints) {
      const labels = dataPoints.map(dp => dp.timestamp);
      const soilValues = dataPoints.map(dp => dp.soil);
      const airValues = dataPoints.map(dp => dp.air);

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = soilValues;
        chart.data.datasets[1].data = airValues;
        chart.update();
      } else {
        const ctx = document.getElementById('sensorChart').getContext('2d');
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Soil',
                data: soilValues,
                borderWidth: 2,
                borderColor: 'green',
                fill: false
              },
              {
                label: 'Air',
                data: airValues,
                borderWidth: 2,
                borderColor: 'blue',
                fill: false
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      }
    }

    const dropdown = document.getElementById("nodeSelect");
    dropdown.addEventListener("change", () => {
      loadSensorData(dropdown.value);
    });

    // Initial load
    loadSensorData(dropdown.value);
  </script>
</body>
</html>
