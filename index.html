<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      text-align: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      margin: 20px auto;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    canvas {
      background: #fff;
      border-radius: 10px;
      margin: 30px auto;
      padding: 10px;
      display: block;
      max-width: 95vw;
      height: 300px !important;
    }
    select {
      font-size: 16px;
      padding: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>LoRa Sensor Dashboard</h2>

  <label for="nodeSelect">Select Node: </label>
  <select id="nodeSelect">
    <option value="Node1">Node1</option>
    <option value="Node2">Node2</option>
    <option value="Node3">Node3</option>
    <option value="Node4">Node4</option>
    <option value="Node5">Node5</option>
  </select>

  <div class="card">
    <p><strong>Soil Moisture:</strong> <span id="soil">--</span></p>
    <p><strong>Air Quality:</strong> <span id="air">--</span></p>
    <p><strong>Last Updated:</strong> <span id="timestamp">--</span></p>
    <p><strong>Alert:</strong> <span id="alert">--</span></p>
  </div>

  <canvas id="chart"></canvas>

  <script>
    const mockRanges = {
      "Node1": { soil: [350, 450], air: [190, 250] },
      "Node2": { soil: [370, 460], air: [180, 230] },
      "Node3": { soil: [360, 440], air: [200, 260] },
      "Node4": { soil: [390, 470], air: [170, 220] },
      "Node5": { soil: [400, 480], air: [160, 210] }
    };

    const chart = new Chart(document.getElementById("chart"), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Soil Moisture',
            data: [],
            borderColor: 'green',
            fill: false
          },
          {
            label: 'Air Quality',
            data: [],
            borderColor: 'blue',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateDashboard() {
      const node = document.getElementById("nodeSelect").value;
      const soil = getRandomInt(...mockRanges[node].soil);
      const air = getRandomInt(...mockRanges[node].air);

      document.getElementById("soil").textContent = soil;
      document.getElementById("air").textContent = air;
      const now = new Date();
      document.getElementById("timestamp").textContent = now.toLocaleString();
      document.getElementById("alert").textContent = (soil > 600 || air > 300) ? "⚠️ High reading" : "Normal";

      const label = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(soil);
      chart.data.datasets[1].data.push(air);

      if (chart.data.labels.length > 10) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }
      chart.update();
    }

    document.getElementById("nodeSelect").addEventListener("change", () => {
      chart.data.labels = [];
      chart.data.datasets.forEach(ds => ds.data = []);
      chart.update();
      updateDashboard();
    });

    updateDashboard(); // Only run once on load
  </script>
</body>
</html>
