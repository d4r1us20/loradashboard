<!DOCTYPE html>
<html>
<head>
  <title>LoRa Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; text-align: center; background: #f4f4f4; padding: 20px; }
    .card { background: #fff; margin: 0 auto 20px; padding: 20px; border-radius: 10px; width: 350px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    canvas { max-width: 100%; }
    select { padding: 5px; margin: 10px; }
  </style>
</head>
<body>
  <h1>LoRa Sensor Dashboard</h1>
  <div>
    <label for="nodeSelect">Select Node:</label>
    <select id="nodeSelect">
      <option value="Node1">Node 1</option>
      <option value="Node2">Node 2</option>
      <option value="Node3">Node 3</option>
      <option value="Node4">Node 4</option>
      <option value="Node5">Node 5</option>
    </select>
  </div>

  <div class="card">
    <p><strong>Soil:</strong> <span id="soil">--</span></p>
    <p><strong>Air:</strong> <span id="air">--</span></p>
    <p><strong>Last Updated:</strong> <span id="timestamp">--</span></p>
    <p><strong>Alert:</strong> <span id="alert">None</span></p>
  </div>

  <canvas id="sensorChart" height="100"></canvas>

  <script>
    const sasToken = "sp=r&st=2025-04-30T04:02:20Z&se=2026-01-01T13:02:20Z&spr=https&sv=2024-11-04&sr=c&sig=oD6buZNfxH2Q6JvuI%2FmAHIpBhA%2B2cuisdPaNp1NiLEk%3D";
    const baseUrl = "https://wsn.blob.core.windows.net/loradata";

    const ctx = document.getElementById('sensorChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Soil', data: [], borderColor: 'green', fill: false },
          { label: 'Air', data: [], borderColor: 'blue', fill: false }
        ]
      },
      options: {
        scales: { y: { beginAtZero: true } },
        responsive: true
      }
    });

    function getCurrentUtcPath(node) {
      const now = new Date();
      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(now.getUTCDate()).padStart(2, '0');
      const hh = String(now.getUTCHours()).padStart(2, '0');
      return `node-${node}/${yyyy}/${mm}/${dd}/${hh}/`;
    }

    async function fetchLatestJsonFile(node) {
      const folderPath = getCurrentUtcPath(node);
      const listUrl = `${baseUrl}?restype=container&comp=list&prefix=${folderPath}&${sasToken}`;

      try {
        const listRes = await fetch(listUrl);
        const xmlText = await listRes.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const blobs = Array.from(xml.getElementsByTagName("Name")).map(n => n.textContent);

        if (blobs.length === 0) throw new Error("No files found in path");

        const latestFile = blobs.pop(); // last file (should be latest)
        const fileUrl = `${baseUrl}/${latestFile}?${sasToken}`;
        const res = await fetch(fileUrl);
        const json = await res.json();

        updateDashboard(json);
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById("soil").textContent = "Error";
        document.getElementById("air").textContent = "Error";
        document.getElementById("timestamp").textContent = "--";
        document.getElementById("alert").textContent = "Fetch failed";
      }
    }

    function updateDashboard(data) {
      const { soil, air } = data;
      const timestamp = new Date().toLocaleString();

      document.getElementById("soil").textContent = soil;
      document.getElementById("air").textContent = air;
      document.getElementById("timestamp").textContent = timestamp;

      let alert = "None";
      if (soil > 600 || air > 600) alert = "High readings!";
      if (soil < 300 || air < 300) alert = "Low readings!";
      document.getElementById("alert").textContent = alert;

      if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
        chart.data.datasets[1].data.shift();
      }

      chart.data.labels.push(timestamp);
      chart.data.datasets[0].data.push(soil);
      chart.data.datasets[1].data.push(air);
      chart.update();
    }

    function updateLoop() {
      const node = document.getElementById("nodeSelect").value;
      fetchLatestJsonFile(node);
    }

    document.getElementById("nodeSelect").addEventListener("change", updateLoop);
    setInterval(updateLoop, 15000); // auto-refresh every 15 sec
    updateLoop(); // initial fetch
  </script>
</body>
</html>
